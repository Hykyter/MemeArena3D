<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meme Arena 3D</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px 20px 0 0; color: white; text-align: center; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        button { background: #333; color: white; border: 1px solid #555; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
        button:active { background: #0088cc; }
    </style>
</head>
<body>
    <div id="container"></div>

    <div id="ui">
        <h2 id="char-name">PEPE_CUBE v1.0</h2>
        <div class="btn-group">
            <button onclick="changeColor(0x00ff00)">GREEN</button>
            <button onclick="changeColor(0xff0000)">RED</button>
            <button onclick="changeColor(0x0000ff)">BLUE</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, cube;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // Создаем временного "персонажа" — куб
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
            cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            // Свет, чтобы куб был объемным
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            camera.position.z = 5;
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        function changeColor(hex) {
            cube.material.color.setHex(hex);
        }

        init();
    </script>
</body>
</html>
