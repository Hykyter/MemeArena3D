<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meme Arena 3D</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* Имбовый интерфейс */
        #ui { 
            position: absolute; bottom: 0; width: 100%; 
            background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0.8)); 
            backdrop-filter: blur(15px); padding: 25px; 
            border-radius: 30px 30px 0 0; border-top: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box; text-align: center;
        }

        .stats { color: #00ff00; font-family: monospace; margin-bottom: 10px; font-size: 14px; }
        .char-name { font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }

        .btn-group { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        button { 
            background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.2); 
            padding: 15px 25px; border-radius: 15px; font-weight: bold; cursor: pointer;
            white-space: nowrap; transition: 0.3s;
        }
        button:active { background: #0088cc; transform: scale(0.9); }
        button.active { border-color: #0088cc; background: rgba(0,136,204,0.2); }

        /* Лоадер (пока грузится модель) */
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-weight: bold; color: #0088cc; display: none;
        }
    </style>
</head>
<body>

    <div id="loader">ЗАГРУЗКА МЕМА...</div>
    <div id="container"></div>

    <div id="ui">
        <div class="stats" id="char-stats">HP: 100 | ATK: 15 | DEF: 10</div>
        <div class="char-name" id="display-name">PEPE</div>
        
        <div class="btn-group">
            <button onclick="selectHero('pepe', this)" class="active">PEPE</button>
            <button onclick="selectHero('redo', this)">REDO</button>
            <button onclick="selectHero('shlepa', this)">SHLEPA</button>
            <button onclick="selectHero('doge', this)">DOGE</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        let scene, camera, renderer, currentModel;
        const loader = new THREE.GLTFLoader();
        const loadingText = document.getElementById('loader');

        // Список моделей (ссылки пока тестовые, потом заменим на твои .glb)
        const models = {
            pepe: { url: 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', stats: 'HP: 120 | ATK: 20 | DEF: 15' },
            redo: { url: 'https://threejs.org/examples/models/gltf/XBot.glb', stats: 'HP: 100 | ATK: 25 | DEF: 10' },
            shlepa: { url: 'https://threejs.org/examples/models/gltf/AlphaBlendModeTest.glb', stats: 'HP: 200 | ATK: 10 | DEF: 30' },
            doge: { url: 'https://threejs.org/examples/models/gltf/DamagedHelmet.glb', stats: 'HP: 150 | ATK: 18 | DEF: 20' }
        };

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('container').appendChild(renderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const spotLight = new THREE.SpotLight(0xffffff, 1);
            spotLight.position.set(5, 10, 5);
            scene.add(spotLight);

            // Загружаем первого перса по умолчанию
            selectHero('pepe', document.querySelector('.active'));

            animate();
        }

        function selectHero(heroKey, btn) {
            // Визуал кнопок
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const hero = models[heroKey];
            document.getElementById('display-name').innerText = heroKey.toUpperCase();
            document.getElementById('char-stats').innerText = hero.stats;

            loadModel(hero.url);
        }

        function loadModel(url) {
            loadingText.style.display = 'block';
            
            if (currentModel) scene.remove(currentModel);

            loader.load(url, function (gltf) {
                currentModel = gltf.scene;
                currentModel.position.y = 0;
                
                // Центрируем и масштабируем под экран
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                currentModel.position.x += (currentModel.position.x - center.x);
                currentModel.position.y += (currentModel.position.y - center.y);
                currentModel.scale.setScalar(2 / size);

                scene.add(currentModel);
                loadingText.style.display = 'none';
            }, undefined, function (error) {
                console.error(error);
                loadingText.innerText = "ОШИБКА ЗАГРУЗКИ";
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentModel) currentModel.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
