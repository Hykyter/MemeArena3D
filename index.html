<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Meme Arena 3D</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .game-screen { height: 100vh; display: flex; flex-direction: column; }
        #canvas-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 80px; background: radial-gradient(circle, #222 0%, #000 100%); }
        .ui-panel { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); padding: 20px; border-radius: 25px 25px 0 0; border-top: 1px solid #333; text-align: center; }
        .char-info { margin-bottom: 15px; }
        .char-name { font-size: 22px; font-weight: bold; color: #0088cc; text-transform: uppercase; }
        .nav { display: flex; justify-content: space-around; gap: 10px; }
        button { background: #252525; color: #fff; border: 1px solid #444; padding: 15px; border-radius: 12px; flex: 1; font-weight: bold; font-size: 14px; }
        button:active { background: #0088cc; transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-screen">
        <div id="canvas-container">🐸</div>

        <div class="ui-panel">
            <div class="char-info">
                <div class="char-name" id="display-name">ПЕПЕ (БОМЖ)</div>
                <div style="font-size: 12px; color: #888;">HP: 100 | ATK: 15</div>
            </div>
            
            <div class="nav">
                <button onclick="changeHero('🐸', 'ПЕПЕ (БОМЖ)')">ПЕПЕ</button>
                <button onclick="changeHero('🐶', 'РЕДО (БОМЖ)')">РЕДО</button>
                <button style="color: #ffd700;">МАГАЗИН</button>
            </div>
        </div>
    </div>

    <script>
        function changeHero(emoji, name) {
            document.getElementById('canvas-container').innerText = emoji;
            document.getElementById('display-name').innerText = name;
        }
    </script>
</body>
</html>
